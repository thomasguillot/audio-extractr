name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kit tests
        run: cd ExtractrKit && swift test
  build-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Fetch binaries
        run: ./scripts/fetch-binaries.sh
      - name: Build app
        run: |
          cd App && xcodegen
          xcodebuild -project AudioExtractr.xcodeproj -scheme AudioExtractr \
            -destination 'platform=macOS' build
